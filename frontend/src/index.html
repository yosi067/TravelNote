<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel OS 旅程中樞</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.64);
        --line: rgba(255, 255, 255, 0.16);
        --glass: rgba(22, 22, 24, 0.58);
        --glass-strong: rgba(32, 32, 36, 0.72);
        --gold: #d8b35a;
        --blue: #58a6ff;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .app-shell {
        position: relative;
        min-height: 100vh;
        background: #050505;
      }

      .map-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          #070707;
        background-size: 72px 72px;
      }

      .google-map {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 360ms ease;
      }

      .map-stage.map-ready {
        background: #050505;
      }

      .map-stage.map-ready .google-map {
        opacity: 1;
      }

      .map-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg width='1400' height='760' viewBox='0 0 1400 760' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='.08' stroke-width='1.4'%3E%3Cpath d='M194 271c65-40 151-51 226-27 54 17 86 55 135 79 68 33 157 20 217-25 69-51 144-94 232-80 88 15 132 81 198 127 60 42 132 52 202 37'/%3E%3Cpath d='M139 459c100-39 194-27 282 36 70 50 154 57 231 18 83-42 159-104 258-95 91 9 149 75 225 113 78 39 172 34 244-12'/%3E%3Cpath d='M319 149c121 62 245 73 374 34 100-30 190-21 270 49'/%3E%3Cpath d='M507 621c86-50 178-69 276-48 69 15 130 48 198 64'/%3E%3C/g%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: center;
        background-size: min(1200px, 96vw) auto;
        opacity: 1;
        transition: opacity 360ms ease;
      }

      .map-stage.map-ready::before {
        opacity: 0;
      }

      .glass-panel {
        border: 1px solid var(--line);
        background: var(--glass);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .top-bar {
        position: absolute;
        top: 24px;
        left: 24px;
        right: 24px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px 14px 20px;
        border-radius: 16px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .brand strong {
        font-size: 18px;
        line-height: 1.1;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pill,
      .icon-button,
      .primary-button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .pill {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
      }

      .icon-button {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
      }

      .primary-button {
        min-height: 44px;
        border-radius: 999px;
        padding: 0 18px;
        cursor: pointer;
        background: #ffffff;
        color: #000000;
        font-weight: 700;
      }

      .pill:hover,
      .icon-button:hover,
      .primary-button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.28);
      }

      .pin {
        position: absolute;
        z-index: 3;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.08), 0 12px 30px rgba(0, 0, 0, 0.42);
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: transform 220ms ease, box-shadow 220ms ease;
      }

      .pin[data-status="past"] {
        background: var(--gold);
      }

      .pin[data-status="future"] {
        background: var(--blue);
      }

      .pin:hover,
      .pin.active {
        transform: translate(-50%, -50%) scale(1.28);
        box-shadow: 0 0 0 14px rgba(255, 255, 255, 0.1), 0 18px 42px rgba(0, 0, 0, 0.52);
      }

      .inspector {
        position: absolute;
        top: 104px;
        right: 24px;
        z-index: 10;
        width: min(360px, calc(100vw - 48px));
        padding: 18px;
        border-radius: 16px;
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .inspector.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .inspector h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .inspector p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
      }

      .timeline-shell {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        z-index: 10;
        border-radius: 16px;
        padding: 16px;
      }

      .timeline-labels {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 12px;
      }

      .timeline-track {
        position: relative;
        height: 96px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-behavior: smooth;
        scrollbar-width: none;
      }

      .timeline-track::-webkit-scrollbar {
        display: none;
      }

      .timeline-inner {
        position: relative;
        min-width: 980px;
        height: 100%;
      }

      .time-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 47px;
        height: 1px;
        background: rgba(255, 255, 255, 0.18);
      }

      .today-pulse {
        position: absolute;
        top: 32px;
        left: 50%;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.78);
        transform: translateX(-50%);
        animation: breathe 2.4s ease-in-out infinite;
      }

      @keyframes breathe {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.12); opacity: 0.7; }
        50% { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); opacity: 1; }
      }

      .timeline-item {
        position: absolute;
        top: 14px;
        width: 160px;
        transform: translateX(-50%);
      }

      .timeline-item button {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        padding: 10px;
        text-align: left;
        cursor: pointer;
        transition: transform 180ms ease, background 180ms ease;
      }

      .timeline-item button:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.13);
      }

      .timeline-item strong,
      .timeline-item span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline-item strong {
        font-size: 13px;
      }

      .timeline-item span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 20;
        width: min(420px, 100vw);
        min-height: 100vh;
        padding: 24px;
        border-left: 1px solid var(--line);
        background: rgba(16, 16, 18, 0.72);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: -24px 0 80px rgba(0, 0, 0, 0.44);
        transform: translateX(105%);
        transition: transform 260ms ease;
      }

      .drawer.open {
        transform: translateX(0);
      }

      .drawer header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .drawer h2 {
        margin: 0;
        font-size: 24px;
      }

      .form-grid {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field span {
        color: var(--muted);
        font-size: 12px;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        padding: 12px;
        outline: none;
        transition: border-color 180ms ease, background 180ms ease;
      }

      .field textarea {
        min-height: 112px;
        resize: vertical;
      }

      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: rgba(255, 255, 255, 0.38);
        background: rgba(255, 255, 255, 0.11);
      }

      .status-line {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 720px) {
        .top-bar {
          top: 12px;
          left: 12px;
          right: 12px;
          align-items: flex-start;
        }

        .brand span,
        .pill {
          display: none;
        }

        .inspector {
          top: 84px;
          right: 12px;
          width: calc(100vw - 24px);
        }

        .timeline-shell {
          left: 12px;
          right: 12px;
          bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="map-stage" id="mapStage" aria-label="旅程地圖">
        <div class="google-map" id="googleMap"></div>
      </section>

      <nav class="top-bar glass-panel">
        <div class="brand">
          <strong>Travel OS</strong>
          <span>回憶足跡與未來行程時間線</span>
        </div>
        <div class="controls">
          <span class="pill" id="tripCount">載入中</span>
          <button class="icon-button" id="openDrawer" type="button" aria-label="新增旅程">+</button>
        </div>
      </nav>

      <aside class="inspector glass-panel" id="inspector" aria-live="polite"></aside>

      <section class="timeline-shell glass-panel" aria-label="旅程時間線">
        <div class="timeline-labels">
          <span>過去</span>
          <span>今日</span>
          <span>未來</span>
        </div>
        <div class="timeline-track" id="timelineTrack">
          <div class="timeline-inner" id="timelineInner">
            <div class="time-line"></div>
            <div class="today-pulse" title="今日"></div>
          </div>
        </div>
      </section>

      <aside class="drawer" id="drawer" aria-label="旅程編輯器">
        <header>
          <h2>新增旅程</h2>
          <button class="icon-button" id="closeDrawer" type="button" aria-label="關閉">x</button>
        </header>
        <form class="form-grid" id="tripForm">
          <label class="field">
            <span>名稱</span>
            <input name="title" required maxlength="120" placeholder="倫敦冬日散步紀錄" />
          </label>
          <label class="field">
            <span>地點</span>
            <input name="location" required maxlength="160" placeholder="英國倫敦" />
          </label>
          <label class="field">
            <span>日期</span>
            <input name="trip_date" required type="date" />
          </label>
          <label class="field">
            <span>狀態</span>
            <select name="status">
              <option value="past">過去</option>
              <option value="future">未來</option>
            </select>
          </label>
          <label class="field">
            <span>緯度</span>
            <input name="latitude" required type="number" step="0.000001" placeholder="51.5072" />
          </label>
          <label class="field">
            <span>經度</span>
            <input name="longitude" required type="number" step="0.000001" placeholder="-0.1276" />
          </label>
          <label class="field">
            <span>標籤</span>
            <input name="tags" placeholder="#非吸菸 #安靜房間" />
          </label>
          <label class="field">
            <span>照片連結</span>
            <input name="photo_url" type="url" placeholder="https://example.com/photo.jpg" />
          </label>
          <label class="field">
            <span>旅行筆記</span>
            <textarea name="diary" maxlength="2000" placeholder="城市醒來前，一段安靜的清晨散步。"></textarea>
          </label>
          <button class="primary-button" type="submit">儲存旅程</button>
          <div class="status-line" id="formStatus"></div>
        </form>
      </aside>
    </main>
    <script type="module" src="/app.js?v=20260526-zh-tw"></script>
  </body>
</html>
