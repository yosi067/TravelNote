services:
  gateway:
    image: nginx:1.27-alpine
    container_name: travel-os-gateway
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/src:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    mem_limit: ${GATEWAY_MEM_LIMIT:-128m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.25}
    networks:
      - travel-os-network

  frontend:
    build:
      context: ./frontend
    container_name: travel-os-frontend
    env_file:
      - .env
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.50}
    networks:
      - travel-os-network

  backend:
    build:
      context: ./backend
    container_name: travel-os-backend
    env_file:
      - .env
    working_dir: /app
    command: npm run dev
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    cpus: ${BACKEND_CPU_LIMIT:-0.75}
    networks:
      - travel-os-network

  database:
    image: postgres:16-alpine
    container_name: travel-os-database
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_os}
      POSTGRES_USER: ${POSTGRES_USER:-travel_os_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_os_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_os_user} -d ${POSTGRES_DB:-travel_os}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${DATABASE_MEM_LIMIT:-500m}
    cpus: ${DATABASE_CPU_LIMIT:-0.75}
    networks:
      - travel-os-network

networks:
  travel-os-network:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
  backend_node_modules:
